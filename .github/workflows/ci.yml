name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rust: stable }
          - { os: macos-latest, rust: stable }
          - { os: windows-latest, rust: stable }
          - { os: ubuntu-latest, rust: '1.85.0' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
      - name: Select toolchain
        run: rustup override set ${{ matrix.rust }}
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Test all packages, targets and doctests
        run: cargo test --workspace --all-features --locked --offline
      - name: Check the no-format facade
        run: cargo check -p caexfer-formats --no-default-features --locked --offline
      - name: Check BDF-only facade
        run: cargo check -p caexfer-formats --no-default-features --features bdf --locked --offline
      - name: Check VTU-only facade
        run: cargo check -p caexfer-formats --no-default-features --features vtu --locked --offline
      - name: Check new format modules separately
        shell: bash
        run: |
          for feature in msh inp frd op2; do
            cargo check -p caexfer-formats --no-default-features --features "$feature" --locked --offline
          done
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked --offline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check generated README diagram
        run: python scripts/generate_readme_diagram.py --check
      - name: Check source package
        run: python scripts/check_source.py
      - name: Execute independent CLI interoperability checks
        run: python scripts/check_interop.py --build
      - name: Check supported conversion matrix
        run: python scripts/check_matrix.py
