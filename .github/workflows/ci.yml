name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rust: stable }
          - { os: macos-latest, rust: stable }
          - { os: windows-latest, rust: stable }
          - { os: ubuntu-latest, rust: '1.85.0' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
      - name: Select toolchain
        run: rustup override set ${{ matrix.rust }}
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Test library, CLI, and examples
        run: cargo test --all-targets --locked --offline
      - name: Test doctests
        run: cargo test --doc --locked --offline
      - name: Clippy
        run: cargo clippy --all-targets --locked --offline -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked --offline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check generated README diagram
        run: python scripts/generate_readme_diagram.py --check
      - name: Verify Cargo package
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo package --locked --offline
      - name: Build CLI for interoperability checks
        run: cargo build --locked --offline
      - name: Execute independent CLI interoperability checks
        run: python scripts/check_interop.py
      - name: Check supported conversion matrix
        run: python scripts/check_matrix.py
      - name: Install pyNastran for OP2 interoperability
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: python -m pip install pyNastran==1.4.1
      - name: Check OP2 conversion matrix
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: python scripts/check_matrix.py --op2-python python
