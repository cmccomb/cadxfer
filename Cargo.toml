[package]
name = "caexfer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Christopher McComb"]
repository = "https://github.com/cmccomb/caexfer"
documentation = "https://docs.rs/caexfer"
description = "Preserve Nastran BDF documents and exchange linear CAE meshes and displacement results"
readme = "README.md"
keywords = ["engineering", "nastran", "file-formats", "mesh"]
categories = ["science", "parser-implementations"]

[dependencies]
quick-xml = "=0.39.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
