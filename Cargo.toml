[workspace]
members = [
    "crates/caxifer-core",
    "crates/caxifer-bdf",
    "crates/caxifer-vtu",
    "crates/caxifer-formats",
    "crates/caxifer",
]
default-members = ["crates/caxifer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Christopher McComb"]
repository = "https://github.com/cmccomb/caxifer"
homepage = "https://github.com/cmccomb/caxifer"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
