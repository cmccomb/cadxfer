[workspace]
members = [
    "crates/cadxfer-core",
    "crates/cadxfer-bdf",
    "crates/cadxfer-vtu",
    "crates/cadxfer-formats",
    "crates/cadxfer",
]
default-members = ["crates/cadxfer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Christopher McComb"]
repository = "https://github.com/cmccomb/cadxfer"
homepage = "https://github.com/cmccomb/cadxfer"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
