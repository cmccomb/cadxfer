[workspace]
members = [
    "crates/caexfer-core",
    "crates/caexfer-bdf",
    "crates/caexfer-vtu",
    "crates/caexfer-formats",
    "crates/caexfer",
]
default-members = ["crates/caexfer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Christopher McComb"]
repository = "https://github.com/cmccomb/caexfer"
homepage = "https://github.com/cmccomb/caexfer"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
