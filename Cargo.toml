[package]
name = "caexfer"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["Christopher McComb"]
repository = "https://github.com/cmccomb/caexfer"
documentation = "https://docs.rs/caexfer"
description = "Transfer linear finite-element meshes and results across CAE formats"
readme = "README.md"
keywords = ["engineering", "nastran", "file-formats", "mesh"]
categories = ["science", "parser-implementations"]

[dependencies]
quick-xml = "=0.42.0"
netcdf3 = "=0.6.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "deny"
