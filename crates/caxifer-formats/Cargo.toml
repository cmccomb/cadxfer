[package]
name = "caxifer-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Feature-selected engineering file format libraries"
readme = "README.md"
keywords = ["engineering", "nastran", "file-formats", "mesh"]
categories = ["science", "parser-implementations"]

[lints]
workspace = true

[features]
default = []
bdf = ["dep:caxifer-bdf"]
vtu = ["dep:caxifer-vtu"]
all-formats = ["bdf", "vtu"]

[dependencies]
caxifer-core = { path = "../caxifer-core", version = "0.1.0" }
caxifer-bdf = { path = "../caxifer-bdf", version = "0.1.0", optional = true }
caxifer-vtu = { path = "../caxifer-vtu", version = "0.1.0", optional = true }

[[example]]
name = "project_geometry"
path = "examples/project_geometry.rs"
required-features = ["bdf", "vtu"]
