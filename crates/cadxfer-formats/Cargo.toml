[package]
name = "cadxfer-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Feature-selected engineering file format libraries"
readme = "README.md"
keywords = ["engineering", "nastran", "file-formats", "mesh"]
categories = ["science", "parser-implementations"]

[lints]
workspace = true

[features]
default = []
bdf = ["dep:cadxfer-bdf"]
vtu = ["dep:cadxfer-vtu"]
all-formats = ["bdf", "vtu"]

[dependencies]
cadxfer-core = { path = "../cadxfer-core", version = "0.1.0" }
cadxfer-bdf = { path = "../cadxfer-bdf", version = "0.1.0", optional = true }
cadxfer-vtu = { path = "../cadxfer-vtu", version = "0.1.0", optional = true }

[[example]]
name = "project_geometry"
path = "examples/project_geometry.rs"
required-features = ["bdf", "vtu"]
