<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">caexfer conversion paths by format role</title>
  <desc id="description">Four related groups connect through caexfer's shared mesh and numeric field projection. BDF and INP are solver inputs; STL, SU2, and UNV are geometry exchange formats; VTU, legacy VTK, MSH, Exodus II, and FRD are mesh datasets. Double arrows show reading and writing. OP2 reads and writes displacement results with a companion mesh; PCH reads results only. Every conversion reports omissions and assumptions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14243a"/>
      <stop offset="1" stop-color="#0b1423"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#d3e4ef" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .heading { fill: #f5f8ff; font: 700 27px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #b6c7d9; font: 17px Arial, Helvetica, sans-serif; }
      .group { font: 700 20px Arial, Helvetica, sans-serif; }
      .formats { fill: #f5f8ff; font: 700 22px Arial, Helvetica, sans-serif; }
      .note { fill: #b6c7d9; font: 16px Arial, Helvetica, sans-serif; }
      .hub-title { fill: #f5f8ff; font: 700 37px Arial, Helvetica, sans-serif; }
      .hub-label { fill: #b6c7d9; font: 17px Arial, Helvetica, sans-serif; }
      .hub-data { fill: #f5f8ff; font: 18px Arial, Helvetica, sans-serif; }
      .footer { fill: #b6c7d9; font: 16px Arial, Helvetica, sans-serif; }
      .card { fill: #17283e; stroke: #42607d; stroke-width: 1.5; }
      .flow { fill: none; stroke: #d3e4ef; stroke-width: 2.4; marker-start: url(#arrow); marker-end: url(#arrow); }
      .inflow { fill: none; stroke: #d3e4ef; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#background)"/>
  <text x="40" y="52" class="heading">CONVERSION PATHS</text>
  <text x="40" y="82" class="subtitle">Related file formats meet at one explicit mesh-and-results projection.</text>

  <!-- The outer cards follow the source-role groups, not four incompatible APIs. -->
  <rect x="40" y="128" width="320" height="180" rx="18" class="card"/>
  <rect x="40" y="128" width="320" height="5" rx="2.5" fill="#69dfc0"/>
  <text x="62" y="170" class="group" fill="#69dfc0">SOLVER INPUTS</text>
  <text x="62" y="217" class="formats">BDF · INP</text>
  <text x="62" y="256" class="note">Mesh and supported sets</text>
  <text x="62" y="280" class="note">Solver data is reported as omitted</text>

  <rect x="40" y="342" width="320" height="180" rx="18" class="card"/>
  <rect x="40" y="342" width="320" height="5" rx="2.5" fill="#c2b4f9"/>
  <text x="62" y="384" class="group" fill="#c2b4f9">GEOMETRY EXCHANGE</text>
  <text x="62" y="431" class="formats">STL · SU2 · UNV</text>
  <text x="62" y="470" class="note">Surfaces, boundaries, or</text>
  <text x="62" y="494" class="note">neutral FE geometry</text>

  <rect x="840" y="128" width="320" height="180" rx="18" class="card"/>
  <rect x="840" y="128" width="320" height="5" rx="2.5" fill="#ffb781"/>
  <text x="862" y="170" class="group" fill="#ffb781">MESH DATASETS</text>
  <text x="862" y="212" class="formats">VTU · VTK · MSH</text>
  <text x="862" y="244" class="formats">Exodus II · FRD</text>
  <text x="862" y="282" class="note">Numeric fields; FRD is nodal only</text>

  <rect x="840" y="342" width="320" height="180" rx="18" class="card"/>
  <rect x="840" y="342" width="320" height="5" rx="2.5" fill="#f28eaa"/>
  <text x="862" y="384" class="group" fill="#f28eaa">COMPANION RESULTS</text>
  <text x="862" y="424" class="formats">OP2  ↔  read + write</text>
  <text x="862" y="460" class="formats">PCH  →  read only</text>
  <text x="862" y="496" class="note">Matching mesh and node IDs required</text>

  <!-- The central projection is common; format-specific limits still apply. -->
  <rect x="410" y="185" width="380" height="275" rx="22" fill="#243d57" stroke="#91b9d3" stroke-width="2"/>
  <text x="600" y="237" class="hub-title" text-anchor="middle">caexfer</text>
  <text x="600" y="269" class="hub-label" text-anchor="middle">shared projection</text>
  <path d="M444 290 H756" stroke="#54738e" stroke-width="1.5"/>
  <text x="600" y="325" class="hub-data" text-anchor="middle">Linear mesh + original IDs</text>
  <text x="600" y="358" class="hub-data" text-anchor="middle">Numeric point/cell fields</text>
  <text x="600" y="391" class="hub-data" text-anchor="middle">Named sets where supported</text>
  <rect x="449" y="409" width="302" height="35" rx="17.5" fill="#193248"/>
  <text x="600" y="433" class="hub-label" text-anchor="middle">Receipt: omissions + assumptions</text>

  <!-- OP2 has two directions; PCH has an input arrow only. -->
  <path d="M368 218 H402" class="flow"/>
  <path d="M368 414 H402" class="flow"/>
  <path d="M798 218 H832" class="flow"/>
  <path d="M798 414 H832" class="flow"/>
  <path d="M832 452 H798" class="inflow"/>

  <path d="M40 552 H1160" stroke="#304761"/>
  <text x="40" y="578" class="footer">↔ Read + write</text>
  <text x="210" y="578" class="footer">→ Read only</text>
  <text x="390" y="578" class="footer">Arrows show supported subsets, not lossless transfer.</text>
  <text x="40" y="601" class="footer">A destination may omit data; the conversion receipt names each omission or assumption.</text>
</svg>
